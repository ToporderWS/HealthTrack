[pytest]
; S2 batch 2 - backend automated tests
; Run: backend\.venv\Scripts\python.exe -m pytest
; NOTE: keep this file ASCII-only (locale encoding is GBK on this machine,
;       non-ASCII content can break the INI reader).
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
